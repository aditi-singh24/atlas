<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'atlas-bg': '#F9F6F0',
            'atlas-dark': '#2F3131',
            'atlas-text': '#1A1C1C',
            'atlas-muted': '#566062',
            'atlas-red': '#B0323A',
            'atlas-orange': '#D97746',
            'atlas-green': '#10B981',
            'atlas-teal': '#8AA8AB',
            'atlas-card': '#FFFFFF',
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>

<body
  class="bg-atlas-bg text-atlas-text font-sans antialiased min-h-screen flex flex-col justify-between bg-cover bg-center bg-fixed"
  style="background-image: linear-gradient(rgba(249, 246, 240, 0.78), rgba(249, 246, 240, 0.9)), url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=2400&q=85');">

  <!-- Header -->
  <header class="p-6 flex justify-between items-center container mx-auto">
    <a href="landing_page.html" class="flex items-center space-x-3">
      <img src="logo.png" alt="ATLAS Logo" class="h-9 w-9 rounded-full aspect-square object-cover">
      <div>
        <span
          class="font-display font-bold text-2xl tracking-wide uppercase text-atlas-text leading-none block">ATLAS</span>
      </div>
    </a>
    <a href="public_dashboard.html"
      class="text-xs font-semibold text-atlas-muted hover:text-atlas-text transition-colors flex items-center gap-1">
      <span class="material-symbols-outlined text-sm">public</span> Open Public View
    </a>
  </header>

  <!-- Login Main Card -->
  <main class="flex-grow flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white rounded-2xl p-8 border border-gray-200 shadow-lg relative">
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-xl bg-red-50 text-atlas-red mx-auto flex items-center justify-center mb-3">
          <span class="material-symbols-outlined text-2xl">lock</span>
        </div>
        <h1 class="font-display text-2xl font-bold text-atlas-text">System Authentication</h1>
        <p class="text-xs text-atlas-muted mt-1">ATLAS</p>
      </div>

      <form action="dashboard.html" method="GET" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-atlas-text mb-1">Operator ID / Email</label>
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm">person</span>
            <input type="text" value="admin@atlas.gov" required
              class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-atlas-red focus:border-atlas-red outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-atlas-text mb-1">Password</label>
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm">key</span>
            <input type="password" value="••••••••••••" required
              class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-atlas-red focus:border-atlas-red outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-atlas-text mb-1">Role / Access Level</label>
          <select class="w-full text-xs border-gray-300 rounded-lg p-2.5 bg-gray-50 font-medium text-atlas-text">
            <option value="admin">TMS System Administrator (Full Control)</option>
            <option value="dispatcher">Emergency Dispatcher (Green Corridor Ops)</option>
            <option value="observer">Traffic Observer (Read-Only Logs)</option>
          </select>
        </div>

        <button type="submit"
          class="w-full bg-atlas-red hover:bg-atlas-red-hover text-white py-3 rounded-lg font-bold text-xs shadow-md transition-colors mt-2 flex items-center justify-center gap-1.5">
          Sign In to Admin Dashboard <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </button>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-atlas-dark text-gray-400 py-4 px-6 text-xs text-center border-t border-gray-700">
    ATLAS
  </footer>

</body>

</html>
